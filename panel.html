<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şube Yönetim Paneli | Uçan Paket Sepeti</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #f8fafc; color: #1e293b; padding: 20px; }

        .panel-container { max-width: 1200px; margin: 0 auto; }
        
        /* HEADER BAR */
        .panel-header { background: #ffffff; border: 1px solid #e2e8f0; padding: 20px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .panel-header h1 { font-size: clamp(20px, 4vw, 26px); font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 10px; }
        .panel-header h1 span { color: #ff6b00; }

        /* ŞUBE SEÇİM KUTUSU */
        .branch-selector-box { display: flex; align-items: center; gap: 10px; }
        .branch-selector-box label { font-size: 14px; font-weight: 600; color: #475569; white-space: nowrap; }
        .branch-selector-box select { padding: 10px 15px; background: #ffffff; border: 2px solid #ff6b00; border-radius: 8px; color: #0f172a; font-weight: 700; font-size: 14px; outline: none; cursor: pointer; }

        /* SİPARİŞLER TABLOSU / KARTLARI */
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .order-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; }
        .order-card:hover { border-color: #ff6b00; box-shadow: 0 8px 25px rgba(255,107,0,0.15); }
        
        .order-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 12px; }
        .order-id { font-size: 13px; color: #64748b; font-weight: 600; }
        .order-branch-badge { background: rgba(255, 107, 0, 0.1); color: #ff6b00; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1px solid rgba(255, 107, 0, 0.2); }

        .order-body p { font-size: 14px; color: #475569; margin-bottom: 8px; line-height: 1.4; word-break: break-word; }
        .order-body p strong { color: #0f172a; }

        .order-products-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 13px; color: #1e293b; }

        .order-footer { margin-top: 15px; border-top: 1px solid #f1f5f9; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .order-status-select { padding: 8px 12px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; color: #0f172a; font-weight: 600; font-size: 13px; outline: none; cursor: pointer; }
        .order-price { font-size: 16px; font-weight: 800; color: #ff6b00; }

        .no-order { text-align: center; color: #64748b; grid-column: 1/-1; padding: 40px; font-size: 16px; background: #ffffff; border-radius: 14px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* FOOTER İMZA */
        .panel-footer { text-align: center; margin-top: 50px; font-size: 12px; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="panel-container">
        
        <div class="panel-header">
            <h1><i class="fa-solid fa-chart-line" style="color:#ff6b00;"></i> Şube <span>Yönetim Paneli</span></h1>
            
            <div class="branch-selector-box">
                <label><i class="fa-solid fa-store"></i> Aktif Şubeniz:</label>
                <select id="yonetimSubeSecim" onchange="subeDegisti()">
                    <option value="Merkez Gülpınar Şube">Merkez Gülpınar Şube</option>
                    <option value="Feridunçelik Şube">Feridunçelik Şube</option>
                    <option value="Karapürçek Şube">Karapürçek Şube</option>
                </select>
            </div>
        </div>

        <!-- SİPARİŞLERİN LİSTELENECEĞİ ALAN -->
        <div id="subeSiparisleriListesi" class="orders-grid">
            <div class="no-order">Siparişler yükleniyor...</div>
        </div>

        <div class="panel-footer">
            <p>&copy; 2026 Uçan Paket Sepeti. Tüm hakları saklıdır.</p>
            <p style="margin-top: 6px; color: #ff6b00; font-weight: 600; letter-spacing: 0.5px;">TAN MEDYA TASARIM Tarafından Kurulmuştur.</p>
        </div>
    </div>

    <!-- BİLDİRİM SESİ İÇİN WEB AUDIO API SYNTH (Harici dosya gerektirmez, anında çalar) -->
    <script>
        function bildirimZiliCal() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 nota
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15); // A5 nota
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } catch(e) {
                // Tarayıcı izin kısıtı varsa sessiz geç
            }
        }
    </script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDMIz96KNZF-7zWGRuI-2fvQ72fZImHtUw",
          authDomain: "eretankartal.firebaseapp.com",
          databaseURL: "https://eretankartal-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "eretankartal",
          storageBucket: "eretankartal.firebasestorage.app",
          messagingSenderId: "775846519838",
          appId: "1:775846519838:web:75b1d7dfb4ef942a3f7a0f"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let aktifSecilenSube = localStorage.getItem('yonetim_aktif_sube') || "Merkez Gülpınar Şube";
        document.getElementById('yonetimSubeSecim').value = aktifSecilenSube;

        let eskiSiparisSayisi = null;

        function subeDegisti() {
            aktifSecilenSube = document.getElementById('yonetimSubeSecim').value;
            localStorage.setItem('yonetim_aktif_sube', aktifSecilenSube);
            eskiSiparisSayisi = null; // Sıfırla ki şube değişince tekrar kontrol etsin
            siparisleriDinleVeGoster();
        }

        function siparisDurumGuncelle(siparisId, yeniDurum) {
            db.ref('orders/' + siparisId).update({ status: yeniDurum })
                .then(() => {})
                .catch((err) => {
                    alert("Durum güncellenirken hata oluştu: " + err.message);
                });
        }

        function siparisleriDinleVeGoster() {
            db.ref('orders').on('value', (snapshot) => {
                const listeDiv = document.getElementById('subeSiparisleriListesi');
                listeDiv.innerHTML = '';

                if (!snapshot.exists()) {
                    listeDiv.innerHTML = '<div class="no-order">Şubenize gelen aktif sipariş bulunmuyor.</div>';
                    return;
                }

                const tumSiparisler = snapshot.val();
                let filtreliSiparisler = [];

                Object.values(tumSiparisler).forEach(siparis => {
                    if (siparis.branch === aktifSecilenSube) {
                        filtreliSiparisler.push(siparis);
                    }
                });

                filtreliSiparisler.reverse();

                // Eğer yeni sipariş geldiyse (sayı arttıysa veya ilk yüklemeden sonra yeni eklenmişse) ses çal
                if (eskiSiparisSayisi !== null && filtreliSiparisler.length > eskiSiparisSayisi) {
                    bildirimZiliCal();
                }
                eskiSiparisSayisi = filtreliSiparisler.length;

                if (filtreliSiparisler.length === 0) {
                    listeDiv.innerHTML = `<div class="no-order"><strong>${aktifSecilenSube}</strong> için şu anda aktif sipariş yok.</div>`;
                    return;
                }

                filtreliSiparisler.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    card.innerHTML = `
                        <div>
                            <div class="order-card-header">
                                <span class="order-id"><i class="fa-regular fa-clock"></i> ${s.date} - ${s.time}</span>
                                <span class="order-branch-badge">${s.branch}</span>
                            </div>
                            <div class="order-body">
                                <p><strong>Müşteri:</strong> ${s.name}</p>
                                <p><strong>Telefon:</strong> <a href="tel:${s.phone}" style="color:#ff6b00; text-decoration:none;">${s.phone}</a></p>
                                <p><strong>Adres:</strong> ${s.address}</p>
                                <div class="order-products-box">
                                    <strong>Sipariş İçeriği:</strong><br>
                                    ${s.product}
                                </div>
                            </div>
                        </div>
                        <div class="order-footer">
                            <span class="order-price">${s.price} ₺</span>
                            <select class="order-status-select" onchange="siparisDurumGuncelle('${s.id}', this.value)">
                                <option value="Yeni Sipariş" ${s.status === 'Yeni Sipariş' ? 'selected' : ''}>Yeni Sipariş</option>
                                <option value="Hazırlanıyor" ${s.status === 'Hazırlanıyor' ? 'selected' : ''}>Hazırlanıyor</option>
                                <option value="Yola Çıktı" ${s.status === 'Yola Çıktı' ? 'selected' : ''}>Yola Çıktı</option>
                                <option value="Teslim Edildi" ${s.status === 'Teslim Edildi' ? 'selected' : ''}>Teslim Edildi</option>
                            </select>
                        </div>
                    `;
                    listeDiv.appendChild(card);
                });
            });
        }

        siparisleriDinleVeGoster();
    </script>
</body>
</html>
