<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesyonel Şube Yönetim Paneli | Ertan Kartal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .panel-header { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; }
        .panel-header h1 { color: #ff6b00; margin: 0; font-size: 22px; }
        
        .controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        select { padding: 10px 15px; border: 2px solid #e2e8f0; border-radius: 8px; font-weight: 600; background: #fff; cursor: pointer; color: #334155; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; background: #e2e8f0; color: #475569; transition: 0.2s; }
        .tab-btn.active { background: #ff6b00; color: white; }

        .order-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; border-left: 6px solid #ff6b00; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; animation: yeniAnimasyon 0.5s ease; }
        @keyframes yeniAnimasyon {
            0% { transform: scale(0.98); opacity: 0; background: #fff7ed; }
            100% { transform: scale(1); opacity: 1; background: #white; }
        }

        .order-info h3 { margin: 0 0 6px 0; color: #1e293b; font-size: 17px; }
        .order-info p { margin: 3px 0; color: #64748b; font-size: 14px; }
        
        .order-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .action-btn { padding: 8px 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }
        .btn-hazirlaniyor { background: #f59e0b; color: white; }
        .btn-yolaycikti { background: #3b82f6; color: white; }
        .btn-teslim { background: #10b981; color: white; }
        .btn-sil { background: #ef4444; color: white; }
        
        .badge { background: #fef3c7; color: #d97706; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 12px; }
        .badge.completed { background: #d1fae5; color: #065f46; }

        .footer-summary { background: #1e293b; color: white; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-top: 30px; font-weight: 600; }
        .footer-summary span { color: #ff6b00; font-size: 20px; }

        #bildirimKutusu {
            display: none;
            background: #ff6b00;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 12px rgba(255,107,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel-header">
            <h1><i class="fa-solid fa-store"></i> Ertan Kartal Yönetim Paneli</h1>
            <div class="controls">
                <label for="branchFilter" style="font-weight: 600; font-size: 14px;">Şube Seç:</label>
                <select id="branchFilter" onchange="ekraniYenile()">
                    <option value="Tümü">Tüm Şubeler</option>
                    <option value="Merkez Şube">Merkez Şube</option>
                    <option value="Feridunçelik Şube">Feridunçelik Şube</option>
                    <option value="Karapürçek Şube">Karapürçek Şube</option>
                </select>
            </div>
        </div>

        <div id="bildirimKutusu">
            <i class="fa-solid fa-bell"></i> 🔔 Dikkat! Panele Yeni Bir Sipariş Düştü!
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabGelen" onclick="sekmeDegis('gelen')">Aktif Siparişler</button>
            <button class="tab-btn" id="tabGecmis" onclick="sekmeDegis('gecmis')">Geçmiş / Tamamlananlar</button>
        </div>

        <div id="siparisListesiContainer">
            <p style="color: #64748b;">Siparişler yükleniyor...</p>
        </div>

        <div class="footer-summary">
            <div>Toplam Gösterilen Sipariş: <span id="toplamAdet">0</span></div>
            <div>Total Tutar / Ciro: <span id="toplamCiro">0 ₺</span></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDMIz96KNZF-7zWGRuI-2fvQ72fZImHtUw",
          authDomain: "eretankartal.firebaseapp.com",
          databaseURL: "https://eretankartal-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "eretankartal",
          storageBucket: "eretankartal.firebasestorage.app",
          messagingSenderId: "775846519838",
          appId: "1:775846519838:web:75b1d7dfb4ef942a3f7a0f"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let aktifSekme = 'gelen';
        let hamVeriler = {};
        let eskiSayi = -1;

        function bildirimSesiCal() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) {}
        }

        function sekmeDegis(sekme) {
            aktifSekme = sekme;
            document.getElementById('tabGelen').classList.toggle('active', sekme === 'gelen');
            document.getElementById('tabGecmis').classList.toggle('active', sekme === 'gecmis');
            ekraniYenile();
        }

        db.ref('orders').on('value', (snapshot) => {
            const data = snapshot.val();
            hamVeriler = data || {};

            let toplamYeni = 0;
            Object.values(hamVeriler).forEach(s => {
                if(s.status === 'Yeni Sipariş') toplamYeni++;
            });

            if (eskiSayi !== -1 && toplamYeni > eskiSayi) {
                const bKutusu = document.getElementById('bildirimKutusu');
                bKutusu.style.display = 'block';
                setTimeout(() => { bKutusu.style.display = 'none'; }, 6000);
                bildirimSesiCal();
            }
            eskiSayi = toplamYeni;

            ekraniYenile();
        });

        function ekraniYenile() {
            const secilenSube = document.getElementById('branchFilter').value;
            const container = document.getElementById('siparisListesiContainer');
            
            let dizi = [];
            Object.keys(hamVeriler).forEach(key => {
                dizi.push({ firebaseKey: key, ...hamVeriler[key] });
            });
            dizi.reverse();

            let filtrelenmis = dizi.filter(s => {
                let aktifDurumlar = (s.status === 'Yeni Sipariş' || s.status === 'Hazırlanıyor' || s.status === 'Yola Çıktı');
                let gecmisDurumlar = (s.status === 'Teslim Edildi');

                let sekmeUyumlu = (aktifSekme === 'gelen') ? aktifDurumlar : gecmisDurumlar;
                let subeUyumlu = (secilenSube === 'Tümü') || (s.branch === secilenSube);
                return sekmeUyumlu && subeUyumlu;
            });

            if (filtrelenmis.length === 0) {
                container.innerHTML = `<p style="color: #64748b; background: white; padding: 25px; border-radius: 10px; text-align: center;">Bu kategoride henüz sipariş bulunmuyor.</p>`;
                document.getElementById('toplamAdet').textContent = '0';
                document.getElementById('toplamCiro').textContent = '0 ₺';
                return;
            }

            let html = '';
            let ciro = 0;

            filtrelenmis.forEach(s => {
                ciro += (s.price || 0);
                const badgeClass = s.status === 'Teslim Edildi' ? 'badge completed' : 'badge';
                
                html += `
                    <div class="order-card">
                        <div class="order-info">
                            <h3>${s.product} — <span style="color:#ff6b00;">${s.branch}</span></h3>
                            <p><strong>Müşteri:</strong> ${s.name} (${s.phone})</p>
                            <p><strong>Adres:</strong> ${s.address}</p>
                            <p><strong>Tutar:</strong> <span style="color: #10b981; font-weight:700;">${s.price || 0} ₺</span> | <strong>Saat:</strong> ${s.time} (${s.date})</p>
                        </div>
                        <div class="order-actions">
                            <span class="${badgeClass}">${s.status}</span>
                            ${aktifSekme === 'gelen' ? `
                                <button class="action-btn btn-hazirlaniyor" onclick="durumGuncelle('${s.firebaseKey}', 'Hazırlanıyor')">Hazırlanıyor</button>
                                <button class="action-btn btn-yolaycikti" onclick="durumGuncelle('${s.firebaseKey}', 'Yola Çıktı')">Yola Çıktı</button>
                                <button class="action-btn btn-teslim" onclick="durumGuncelle('${s.firebaseKey}', 'Teslim Edildi')">Teslim Et</button>
                            ` : ''}
                            <button class="action-btn btn-sil" onclick="siparisSil('${s.firebaseKey}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('toplamAdet').textContent = filtrelenmis.length;
            document.getElementById('toplamCiro').textContent = ciro + ' ₺';
        }

        window.durumGuncelle = function(key, yeniDurum) {
            db.ref('orders/' + key).update({ status: yeniDurum });
        };

        window.siparisSil = function(key) {
            if(confirm("Bu siparişi silmek istediğinize emin misiniz?")) {
                db.ref('orders/' + key).remove();
            }
        };
    </script>
</body>
</html>
