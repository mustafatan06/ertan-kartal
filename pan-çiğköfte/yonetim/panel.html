<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altındağ Çiğ Köfte | Canlı Şube Yönetim Paneli</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Ana Stil Dosyası -->
    <link rel="stylesheet" href="../style.css">
    <style>
        .panel-body { background-color: #f1f5f9; padding: 30px 0; min-height: 100vh; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: white; padding: 20px 30px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); flex-wrap: wrap; gap: 15px; }
        .branch-selector { display: flex; align-items: center; gap: 12px; }
        .branch-selector select { padding: 10px 15px; border-radius: 8px; border: 2px solid var(--pan-orange); font-weight: 600; font-size: 14px; outline: none; background: #fff4f0; color: var(--pan-dark); cursor: pointer; }
        .live-badge { background-color: #27ae60; color: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .live-badge i { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .order-ticket { background: white; border-radius: 14px; padding: 22px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); border-left: 6px solid var(--pan-orange); position: relative; transition: transform 0.2s; }
        .order-ticket:hover { transform: translateY(-3px); }
        .order-ticket h3 { font-size: 17px; color: var(--pan-dark); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px; }
        .order-ticket p { font-size: 14px; color: #444; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .order-ticket p i { color: var(--pan-orange); width: 16px; }
        .order-time { font-size: 12px; color: #777; border-top: 1px solid #f0f0f0; padding-top: 12px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-complete { background: #27ae60; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; transition: background 0.2s; }
        .btn-complete:hover { background: #219653; }
        .no-order { text-align: center; padding: 60px 20px; background: white; border-radius: 14px; color: #888; grid-column: 1 / -1; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .no-order i { font-size: 45px; color: #cbd5e1; margin-bottom: 12px; }
    </style>
</head>
<body class="panel-body">

    <div class="container">
        <!-- ÜST KONTROL ALANI -->
        <div class="panel-header">
            <div>
                <h2><i class="fa-solid fa-store" style="color: var(--pan-orange);"></i> Altındağ Çiğ Köfte Canlı Panel</h2>
                <p style="font-size: 13px; color: #666; margin-top: 4px;">QR menüden gelen siparişler sesli olarak bildirilir.</p>
            </div>
            
            <div class="branch-selector">
                <label for="activeBranch" style="font-weight: 600; font-size: 14px;">Şube Seç:</label>
                <select id="activeBranch" onchange="checkOrders()">
                    <option value="Altındağ Merkez Şube">Altındağ Merkez Şube</option>
                    <option value="Feridunçelik Şube">Feridunçelik Şube</option>
                    <option value="Karapürçek Şube">Karapürçek Şube</option>
                </select>
            </div>

            <div class="live-badge">
                <i class="fa-solid fa-circle"></i> Sistem Canlı
            </div>
        </div>

        <!-- SİPARİŞLERİN LİSTELENECEĞİ ALAN -->
        <div id="ordersContainer" class="orders-grid">
            <!-- JavaScript ile doldurulacak -->
        </div>
    </div>

    <!-- Sesli Uyarı Dosyası -->
    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        function checkOrders() {
            const selectedBranch = document.getElementById('activeBranch').value;
            const allOrders = JSON.parse(localStorage.getItem('altindag_orders')) || [];
            
            const branchOrders = allOrders.filter(o => o.branch === selectedBranch);
            const container = document.getElementById('ordersContainer');
            
            if (branchOrders.length === 0) {
                container.innerHTML = `
                    <div class="no-order">
                        <i class="fa-solid fa-bell-slash"></i>
                        <p><strong>${selectedBranch}</strong> için henüz aktif bir sipariş bulunmuyor.</p>
                    </div>`;
                return;
            }

            let html = '';
            branchOrders.forEach((order, index) => {
                html += `
                    <div class="order-ticket">
                        <h3>
                            <span><i class="fa-solid fa-utensils"></i> ${order.product}</span> 
                            <span style="font-size:13px; background:#fff4f0; color:var(--pan-orange); padding:3px 8px; border-radius:6px;">#${index+1}</span>
                        </h3>
                        <p><i class="fa-solid fa-user"></i> <strong>Ad Soyad:</strong> ${order.name}</p>
                        <p><i class="fa-solid fa-phone"></i> <strong>Telefon:</strong> ${order.phone}</p>
                        <p><i class="fa-solid fa-location-dot"></i> <strong>Adres:</strong> ${order.address}</p>
                        <div class="order-time">
                            <span><i class="fa-regular fa-clock"></i> ${order.time}</span>
                            <button class="btn-complete" onclick="completeOrder(${order.id})">Siparişi Tamamla</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function completeOrder(id) {
            let allOrders = JSON.parse(localStorage.getItem('altindag_orders')) || [];
            allOrders = allOrders.filter(o => o.id !== id);
            localStorage.setItem('altindag_orders', JSON.stringify(allOrders));
            checkOrders();
        }

        // Kesin çözüm: Her 1 saniyede bir tarayıcı hafızasını ve şube siparişlerini tarar
        let lastKnownLength = 0;

        setInterval(() => {
            const allOrders = JSON.parse(localStorage.getItem('altindag_orders')) || [];
            const selectedBranch = document.getElementById('activeBranch').value;
            const branchOrders = allOrders.filter(o => o.branch === selectedBranch);

            // Eğer toplam sipariş sayısı değiştiyse ekranı güncelle
            if (allOrders.length !== lastKnownLength) {
                // Eğer yeni eklenen sipariş aktif şubedeyse ses çal
                if (allOrders.length > lastKnownLength) {
                    const sound = document.getElementById('alertSound');
                    sound.play().catch(e => console.log("Ses çalma bekleniyor"));
                }
                lastKnownLength = allOrders.length;
                checkOrders();
            }
        }, 1000);

        // Sayfa açıldığında ilk yükleme
        checkOrders();
    </script>
</body>
</html>
