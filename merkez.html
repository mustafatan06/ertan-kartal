<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şube Admin Paneli | Ertan Kartal Çiğ Köfte</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #ff6b00; margin-bottom: 5px; }
        .order-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; border-left: 5px solid #ff6b00; display: flex; justify-content: space-between; align-items: center; }
        .order-info h3 { margin: 0 0 8px 0; color: #1e293b; }
        .order-info p { margin: 4px 0; color: #64748b; font-size: 14px; }
        .badge { background: #ff6b00; color: white; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fa-solid fa-store"></i> Canlı Şube Paneli</h1>
        <p style="color: #64748b; margin-bottom: 20px;">Menüden verilen siparişler anlık olarak buraya düşecektir.</p>
        
        <div id="panelListe">
            <p style="color: #64748b;">Siparişler yükleniyor...</p>
        </div>
    </div>

    <script>
        function siparisleriListele() {
            const liste = document.getElementById('panelListe');
            const siparisler = JSON.parse(localStorage.getItem('ertan_orders')) || [];

            if (siparisler.length === 0) {
                liste.innerHTML = '<p style="color: #64748b;">Henüz gelen sipariş bulunmuyor...</p>';
                return;
            }

            let html = '';
            siparisler.forEach(s => {
                html += `
                    <div class="order-card">
                        <div class="order-info">
                            <h3>${s.product} — <span style="color:#ff6b00;">${s.branch}</span></h3>
                            <p><strong>Müşteri:</strong> ${s.name} (${s.phone})</p>
                            <p><strong>Adres:</strong> ${s.address}</p>
                            <p><strong>Saat:</strong> ${s.time}</p>
                        </div>
                        <div>
                            <span class="badge">${s.status}</span>
                        </div>
                    </div>
                `;
            });
            liste.innerHTML = html;
        }

        siparisleriListele();

        // Anlık senkronizasyon dinleyicisi
        window.addEventListener('storage', (e) => {
            if (e.key === 'ertan_orders') {
                siparisleriListele();
            }
        });
    </script>
</body>
</html>
