<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesyonel Şube Yönetim Paneli | Ertan Kartal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* Üst Header / Kontrol Paneli */
        .panel-header { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; }
        .panel-header h1 { color: #ff6b00; margin: 0; font-size: 22px; }
        
        .controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        select { padding: 10px 15px; border: 2px solid #e2e8f0; border-radius: 8px; font-weight: 600; background: #fff; cursor: pointer; color: #334155; }

        /* Sekmeler (Gelen / Geçmiş) */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; background: #e2e8f0; color: #475569; transition: 0.2s; }
        .tab-btn.active { background: #ff6b00; color: white; }

        /* Sipariş Kartı */
        .order-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; border-left: 6px solid #ff6b00; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .order-info h3 { margin: 0 0 6px 0; color: #1e293b; font-size: 17px; }
        .order-info p { margin: 3px 0; color: #64748b; font-size: 14px; }
        
        .order-actions { display: flex; gap: 10px; align-items: center; }
        .action-btn { padding: 8px 14px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn-tamamla { background: #10b981; color: white; }
        .btn-tamamla:hover { background: #059669; }
        .btn-sil { background: #ef4444; color: white; }
        .btn-sil:hover { background: #dc2626; }
        
        .badge { background: #fef3c7; color: #d97706; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 12px; }
        .badge.completed { background: #d1fae5; color: #065f46; }

        /* Altta Total Tutar / Ciro Alanı */
        .footer-summary { background: #1e293b; color: white; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-top: 30px; font-weight: 600; }
        .footer-summary span { color: #ff6b00; font-size: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ÜST KONTROL ALANI & ŞUBE SEÇİMİ -->
        <div class="panel-header">
            <h1><i class="fa-solid fa-store"></i> Ertan Kartal Yönetim Paneli</h1>
            <div class="controls">
                <label for="branchFilter" style="font-weight: 600; font-size: 14px;">Şube Seç:</label>
                <select id="branchFilter" onchange="paneliGuncelle()">
                    <option value="Tümü">Tüm Şubeler</option>
                    <option value="Merkez Şube">Merkez Şube</option>
                    <option value="Feridunçelik Şube">Feridunçelik Şube</option>
                    <option value="Karapürçek Şube">Karapürçek Şube</option>
                </select>
            </div>
        </div>

        <!-- SEKMELER (GELEN / GEÇMİŞ) -->
        <div class="tabs">
            <button class="tab-btn active" id="tabGelen" onclick="sekmeDegis('gelen')">Gelen Siparişler</button>
            <button class="tab-btn" id="tabGecmis" onclick="sekmeDegis('gecmis')">Geçmiş / Tamamlanan Siparişler</button>
        </div>

        <!-- SİPARİŞLERİN LİSTELENECEĞİ ALAN -->
        <div id="siparisListesiContainer">
            <p style="color: #64748b;">Yükleniyor...</p>
        </div>

        <!-- ALT TOTAL TUTAR VE CİRO ALANI -->
        <div class="footer-summary">
            <div>Toplam Gösterilen Sipariş: <span id="toplamAdet">0</span></div>
            <div>Total Tutar / Ciro: <span id="toplamCiro">0 ₺</span></div>
        </div>
    </div>

    <script>
        let aktifSekme = 'gelen'; // 'gelen' veya 'gecmis'

        function sekmeDegis(sekme) {
            aktifSekme = sekme;
            document.getElementById('tabGelen').classList.toggle('active', sekme === 'gelen');
            document.getElementById('tabGecmis').classList.toggle('active', sekme === 'gecmis');
            paneliGuncelle();
        }

        function paneliGuncelle() {
            const secilenSube = document.getElementById('branchFilter').value;
            const container = document.getElementById('siparisListesiContainer');
            let siparisler = JSON.parse(localStorage.getItem('ertan_orders')) || [];

            // Sekme filtrelemesi (Gelenler: Yeni Sipariş | Geçmiş: Tamamlandı)
            let filtrelenmis = siparisler.filter(s => {
                let sekmeUyumlu = (aktifSekme === 'gelen') ? (s.status === 'Yeni Sipariş') : (s.status === 'Tamamlandı');
                let subeUyumlu = (secilenSube === 'Tümü') || (s.branch === secilenSube);
                return sekmeUyumlu && subeUyumlu;
            });

            if (filtrelenmis.length === 0) {
                container.innerHTML = `<p style="color: #64748b; background: white; padding: 25px; border-radius: 10px; text-align: center;">Bu kategoride henüz sipariş bulunmuyor.</p>`;
                document.getElementById('toplamAdet').textContent = '0';
                document.getElementById('toplamCiro').textContent = '0 ₺';
                return;
            }

            let html = '';
            let ciro = 0;

            filtrelenmis.forEach(s => {
                ciro += (s.price || 0);
                const badgeClass = s.status === 'Tamamlandı' ? 'badge completed' : 'badge';
                
                html += `
                    <div class="order-card">
                        <div class="order-info">
                            <h3>${s.product} — <span style="color:#ff6b00;">${s.branch}</span></h3>
                            <p><strong>Müşteri:</strong> ${s.name} (${s.phone})</p>
                            <p><strong>Adres:</strong> ${s.address}</p>
                            <p><strong>Tutar:</strong> <span style="color: #10b981; font-weight:700;">${s.price || 0} ₺</span> | <strong>Saat:</strong> ${s.time} (${s.date})</p>
                        </div>
                        <div class="order-actions">
                            <span class="${badgeClass}">${s.status}</span>
                            ${aktifSekme === 'gelen' ? `<button class="action-btn btn-tamamla" onclick="siparisDurumGuncelle(${s.id}, 'Tamamlandı')">Tamamla</button>` : ''}
                            <button class="action-btn btn-sil" onclick="siparisSil(${s.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('toplamAdet').textContent = filtrelenmis.length;
            document.getElementById('toplamCiro').textContent = ciro + ' ₺';
        }

        // Sipariş durumunu değiştir (Gelen -> Geçmişe taşı)
        window.siparisDurumGuncelle = function(id, yeniDurum) {
            let siparisler = JSON.parse(localStorage.getItem('ertan_orders')) || [];
            siparisler = siparisler.map(s => {
                if(s.id === id) s.status = yeniDurum;
                return s;
            });
            localStorage.setItem('ertan_orders', JSON.stringify(siparisler));
            paneliGuncelle();
        };

        // Siparişi kalıcı olarak sil
        window.siparisSil = function(id) {
            if(confirm("Bu siparişi silmek istediğinize emin misiniz?")) {
                let siparisler = JSON.parse(localStorage.getItem('ertan_orders')) || [];
                siparisler = siparisler.filter(s => s.id !== id);
                localStorage.setItem('ertan_orders', JSON.stringify(siparisler));
                paneliGuncelle();
            }
        };

        // Sayfa açıldığında çalıştır
        paneliGuncelle();

        // Başka sekmeden/menüden sipariş geldikçe anlık senkronizasyon
        window.addEventListener('storage', (e) => {
            if (e.key === 'ertan_orders') {
                paneliGuncelle();
            }
        });
    </script>
</body>
</html>
